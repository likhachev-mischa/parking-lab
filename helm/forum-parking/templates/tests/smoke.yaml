apiVersion: v1
kind: Pod
metadata:
  name: {{ include "forum.name" . }}-smoke
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- include "forum.podSecurity" . | nindent 4 }}
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: smoke
      image: {{ include "forum.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext:
        {{- include "forum.security" . | nindent 8 }}
      env:
        - name: SERVICE_URL
          value: "http://{{ include "forum.name" . }}:3000"
      command:
        - node
        - --input-type=module
        - -e
        - |
          import assert from 'node:assert/strict';
          import { setTimeout } from 'node:timers/promises';
          const get = path => fetch(process.env.SERVICE_URL + path, { signal: AbortSignal.timeout(5000) });
          for (let attempt = 0; ; attempt++) {
            try {
              assert.equal((await (await get('/healthz')).json()).status, 'ok');
              break;
            } catch (error) {
              if (attempt === 9) throw error;
              await setTimeout(1000);
            }
          }
          assert.equal((await (await get('/api/malls')).json()).length, 3);
          assert.match(await (await get('/')).text(), /Форум Паркинг/);
