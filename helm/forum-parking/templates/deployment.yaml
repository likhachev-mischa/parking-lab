apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "forum.name" . }}
  labels:
    {{- include "forum.selector" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "forum.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "forum.selector" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "forum.podSecurity" . | nindent 8 }}
        fsGroup: 1000
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: {{ include "forum.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "forum.security" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: ADMIN_EMAIL
              value: {{ .Values.adminEmail | quote }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | quote }}
                  key: admin-password
            - name: PARKING_RATE_RUB
              value: {{ .Values.rateRub | quote }}
            - name: SECURE_COOKIE
              value: {{ .Values.secureCookie | quote }}
            {{- if .Values.backup.enabled }}
            {{- include "forum.backupToken" . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "forum.claim" . }}
